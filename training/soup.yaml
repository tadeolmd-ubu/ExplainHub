# ExplainHub documentation enhancer — Llama 3 8B Instruct, QLoRA SFT.
#
# Each dataset row is ChatML with exactly one user turn. That turn is the exact
# production prompt from src/modules/ai-enhancer/prompt/promptMdEnhancer.js
# followed by the raw Markdown. The assistant turn is the human-corrected
# Markdown.
#
# Run from this directory:
#   cd training
#   soup train --config soup.yaml --allow-oom-attempt
#
# Paths are relative to the working directory, not to the config file.

base: unsloth/llama-3-8b-Instruct
# Official gated checkpoint, if you have accepted the license and run
# `huggingface-cli login`:
# base: meta-llama/Meta-Llama-3-8B-Instruct

task: sft
modality: text
backend: transformers

data:
  train: ./data/train.jsonl
  format: chatml
  # The row container is ChatML; the model itself is Llama 3, so render with
  # the Llama 3 template. This matches what Ollama applies in production.
  chat_template: llama3
  train_on_responses_only: true
  # Repository-level split: eval.jsonl contains held-out repositories and is
  # scored by scripts/evaluate.mjs. A random row split would leak documents
  # from the same repository into validation.
  val_split: 0.0
  # 6144 tokens fits the longest training row (the ExplainHub README, 5881
  # tokens) and still leaves the 8B QLoRA run inside a 16 GB T4 when Cut
  # Cross-Entropy is enabled below. Raise to 8192 on an A100 40 GB.
  max_length: 6144

training:
  epochs: 3
  lr: 2e-4
  batch_size: 1
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  auto_mixed_precision: true
  optimizer: paged_adamw_8bit
  warmup_ratio: 0.03
  weight_decay: 0.01
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
  quantization: 4bit
  # Cut Cross-Entropy avoids materializing the full (sequence x vocabulary)
  # logits tensor. Without it Soup predicts ~25.1 GB at 6144 tokens (11 GB of
  # that is the logits tensor); with the fused loss the run fits a 16 GB T4.
  # Install `cut-cross-entropy` first:
  #   pip install cut-cross-entropy
  use_cut_ce: true
  seed: 42
  # The dataset has 26 rows, so an epoch is ~4 optimizer steps with
  # batch 1 and accumulation 8. Save every 5 steps to keep checkpoints.
  save_steps: 5
  logging_steps: 1

output: ./output
experiment_name: explainhub-docs-lora
